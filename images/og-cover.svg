<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a1217"/>
      <stop offset="70%" stop-color="#0e080b"/>
      <stop offset="100%" stop-color="#050304"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#ffa07a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Wooden Window Grill Pattern -->
  <g stroke="#3a1c22" stroke-width="6" opacity="0.65">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- Glowing eye in darkness -->
  <circle cx="600" cy="240" r="16" fill="#ff3333" filter="drop-shadow(0 0 15px #ff2222)"/>
  <circle cx="580" cy="238" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="620" cy="238" r="4" fill="#ffffff" opacity="0.8"/>

  <text x="600" y="360" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="74" fill="url(#titleGrad)" letter-spacing="3">
    NARINIG MO BA?
  </text>
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="28" fill="#e6dfd5" opacity="0.9">
    "Did You Hear That?" — Filipino Psychological Horror
  </text>
  <text x="600" y="480" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="500" font-size="20" fill="#a89fa8" letter-spacing="1">
    SARI-SARI STORE SIMULATOR • CHISMIS • DARK MYSTERIES
  </text>
</svg>
